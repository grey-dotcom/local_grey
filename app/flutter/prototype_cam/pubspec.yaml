name: prototype_cam
description: Keeper 서비스 카메라 촬영 모듈 — iOS / Android / Web 지원
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 상태 관리
  provider: ^6.1.2

  # 네트워크
  http: ^1.2.2

  # 카메라 — iOS / Android 네이티브
  # Web은 dart:html + getUserMedia 직접 사용 (camera 패키지 웹 미지원)
  camera: ^0.11.0

  # 파일 경로 (네이티브 촬영 이미지 저장 경로 처리용)
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/task_data.json
    - assets/images/
  # 폰트 추가 시 아래 주석 해제 후 파일 배치
  # fonts:
