<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- 모바일 뷰포트: 390px 고정, 스케일 고정 -->
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Keeper Cam">
  <meta http-equiv="Permissions-Policy" content="camera=(self)">
  <meta http-equiv="Feature-Policy" content="camera 'self'">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Keeper Cam</title>
  <link rel="manifest" href="manifest.json">

  <!-- Spoqa Han Sans Neo CDN -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@latest/css/SpoqaHanSansNeo.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1E293B;
      font-family: 'Spoqa Han Sans Neo', 'Apple SD Gothic Neo', sans-serif;
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-y;
    }

    flt-glass-pane { overflow: hidden !important; }

    video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block;
    }
  </style>
</head>

  <script src="flutter_bootstrap.js" async></script>
